# Data centre hall: rows of server racks, cooling units and two service robots.
#
# Same simulator and file format as sample-floor.toml, in a different setting.
#
# Layout:
#   - left column: cooling units and the spare parts store, serviced from the corridor at x = 4.2;
#   - three rows of racks, with aisles at y = 9.25 and y = 4.75.
# Robots drive in straight lines and ignore what is in the way, so scenes follow the aisles with waypoints.

name = "Data centre hall"

[sim]
tick_ms = 20
seed = 7
dock_tolerance_m = 0.4

[floor]
width_m = 24.0
height_m = 14.0
grid_m = 2.0

# --- Cooling and spare parts ------------------------------------------------------------------

[machines.cooling_unit_a]
label = "Cooling unit A"
position = [2.0, 11.5]
size = [3.6, 2.6]
dock = [4.2, 11.5]
sensors.supply = { kind = "supply_temp", label = "Supply air temperature", unit = "°C", default = 18.0, range = [5.0, 45.0], period_ms = 1000, noise_std = 0.1 }
sensors.fan = { kind = "fan_speed", label = "Fan speed", unit = "%", default = 70.0, range = [0.0, 100.0], period_ms = 1000 }

[machines.spares]
label = "Spares"
position = [2.0, 7.0]
size = [3.6, 2.0]
dock = [4.2, 7.0]

[machines.cooling_unit_b]
label = "Cooling unit B"
position = [2.0, 2.5]
size = [3.6, 2.6]
dock = [4.2, 2.5]
sensors.supply = { kind = "supply_temp", label = "Supply air temperature", unit = "°C", default = 18.0, range = [5.0, 45.0], period_ms = 1000, noise_std = 0.1 }
sensors.fan = { kind = "fan_speed", label = "Fan speed", unit = "%", default = 70.0, range = [0.0, 100.0], period_ms = 1000 }

# --- Racks (docks default to 0.5 m below each row, in the aisle) -------------------------------

[machines.rack_a1]
label = "Rack A1"
position = [8.0, 11.5]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 22.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 8.2, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_a2]
label = "Rack A2"
position = [14.0, 11.5]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 22.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 7.6, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_a3]
label = "Rack A3"
position = [20.0, 11.5]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 22.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 9.1, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_b1]
label = "Rack B1"
position = [8.0, 7.0]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 22.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 8.8, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_b2]
label = "Rack B2"
position = [14.0, 7.0]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 22.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 8.2, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_b3]
label = "Rack B3"
position = [20.0, 7.0]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 22.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 6.9, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_c1]
label = "Rack C1"
position = [8.0, 2.5]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 21.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 7.4, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_c2]
label = "Rack C2"
position = [14.0, 2.5]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 21.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 8.0, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

[machines.rack_c3]
label = "Rack C3"
position = [20.0, 2.5]
size = [5.0, 2.0]
sensors.inlet = { kind = "inlet_temp", label = "Inlet temperature", unit = "°C", default = 21.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }
sensors.power = { label = "Power draw", unit = "kW", default = 7.1, range = [0.0, 20.0], period_ms = 2000, noise_std = 0.05 }

# --- Robots -----------------------------------------------------------------------------------

[mobile_manipulators.service_bot]
label = "Service bot"
start_at = "spares"
max_speed_mps = 0.9
radius_m = 0.35
actions = ["fetch_drive", "swap_drive", "throttle_rack", "repair_unit"]
sensors.battery = { label = "Battery", unit = "%", default = 88.0, range = [0.0, 100.0], period_ms = 5000 }

[mobile_manipulators.scout]
label = "Thermal scout"
start = [5.1, 9.25]
max_speed_mps = 1.0
radius_m = 0.3
actions = ["thermal_scan"]
sensors.ambient = { kind = "ambient_temp", label = "Ambient temperature", unit = "°C", default = 24.0, range = [10.0, 60.0], period_ms = 1000, noise_std = 0.1 }

# --- Hall sensors -----------------------------------------------------------------------------

[sensors.hot_aisle]
label = "Hot aisle"
position = [11.0, 9.1]
kind = "aisle_temp"
unit = "°C"
default = 34.0
range = [10.0, 60.0]
period_ms = 1000
noise_std = 0.1

[sensors.cold_aisle]
label = "Cold aisle"
position = [11.0, 4.6]
kind = "aisle_temp"
unit = "°C"
default = 20.0
range = [10.0, 60.0]
period_ms = 1000
noise_std = 0.1

[sensors.humidity]
label = "Hall humidity"
position = [14.0, 13.3]
unit = "%"
default = 45.0
range = [0.0, 100.0]
period_ms = 5000
noise_std = 0.3

[sensors.hall_power]
label = "Hall power"
position = [20.0, 13.3]
kind = "power"
unit = "kW"
default = 72.0
range = [0.0, 200.0]
period_ms = 2000
noise_std = 0.2

# --- Actions ----------------------------------------------------------------------------------

[actions.fetch_drive]
label = "Fetch drive"
requires_machine = true

[actions.swap_drive]
label = "Swap drive"
requires_machine = true

[actions.throttle_rack]
label = "Throttle rack"
requires_machine = true

[actions.repair_unit]
label = "Repair unit"
requires_machine = true

[actions.thermal_scan]
label = "Thermal scan"
allowed_while_moving = true      # the scout scans as it drives

# --- Scenes -----------------------------------------------------------------------------------

# A normal day: the scout scans its way around row B while the service bot replaces a drive.
[scenes.routine_rounds]
label = "Routine rounds"
loop = true

[[scenes.routine_rounds.tracks]]
name = "scout patrol"
steps = [
  { move_to = { mm = "scout", point = [23.2, 9.25] } },
  { wait_ms = 4000 },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { wait_ms = 6000 },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { wait_ms = 6000 },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { wait_idle = "scout" },
  { move_to = { mm = "scout", point = [23.2, 4.75] } },
  { wait_idle = "scout" },
  { move_to = { mm = "scout", point = [5.1, 4.75] } },
  { wait_ms = 4000 },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { wait_ms = 6000 },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { wait_ms = 6000 },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { wait_idle = "scout" },
  { move_to = { mm = "scout", point = [5.1, 9.25] } },
  { wait_idle = "scout" },
]

[[scenes.routine_rounds.tracks]]
name = "drive replacement"
steps = [
  { perform = { mm = "service_bot", action = "fetch_drive" } },
  { wait_ms = 2000 },
  { move_to = { mm = "service_bot", point = [4.2, 5.5] } },
  { wait_idle = "service_bot" },
  { move_to = { mm = "service_bot", machine = "rack_b2" } },
  { wait_idle = "service_bot" },
  { set_sensor = { sensor = "rack_b2.power", value = 6.5 } },
  { perform = { mm = "service_bot", action = "swap_drive" } },
  { wait_ms = 3000 },
  { set_sensor = { sensor = "rack_b2.power", value = 8.2 } },
  { move_to = { mm = "service_bot", point = [4.2, 5.5] } },
  { wait_idle = "service_bot" },
  { move_to = { mm = "service_bot", machine = "spares" } },
  { wait_idle = "service_bot" },
]

# Cooling unit A's fan stops at 5 s. Heat builds near it and spreads along row A. Rack inlets pass 32 °C
# at about 20 s. The scout goes to look, the service bot throttles rack A1 (26 s) and then repairs the
# cooling unit (fan back at about 38 s), and the hall recovers by 55 s. Tracks can't react to each other, so their
# times are worked out from the robots' speeds and distances.
[scenes.cooling_failure]
label = "Cooling unit A failure"

[[scenes.cooling_failure.tracks]]
name = "cooling units"
steps = [
  { wait_ms = 5000 },
  { set_sensor = { sensor = "cooling_unit_a.fan", value = 0.0 } },
  { wait_ms = 5000 },     # 10 s
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 23.0 } },
  { wait_ms = 5000 },     # 15 s
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 27.0 } },
  { wait_ms = 5000 },     # 20 s
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 31.0 } },
  { wait_ms = 5000 },     # 25 s: cooling unit B works harder to compensate
  { set_sensor = { sensor = "cooling_unit_b.fan", value = 100.0 } },
  { set_sensor = { sensor = "cooling_unit_b.supply", value = 15.0 } },
  { wait_ms = 5000 },     # 30 s
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 34.0 } },
  { wait_ms = 15000 },    # 45 s: repaired, cooling down again
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 28.0 } },
  { wait_ms = 5000 },     # 50 s
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 23.0 } },
  { wait_ms = 5000 },     # 55 s
  { set_sensor = { sensor = "cooling_unit_a.supply", value = 18.0 } },
  { set_sensor = { sensor = "cooling_unit_b.fan", value = 70.0 } },
  { set_sensor = { sensor = "cooling_unit_b.supply", value = 18.0 } },
]

[[scenes.cooling_failure.tracks]]
name = "heat spreads and recedes"
steps = [
  { wait_ms = 10000 },    # 10 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 25.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 36.0 } },
  { wait_ms = 5000 },     # 15 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 29.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 24.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 38.0 } },
  { wait_ms = 5000 },     # 20 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 33.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 27.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 23.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 24.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 41.0 } },
  { wait_ms = 5000 },     # 25 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 36.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 31.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 25.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 26.0 } },
  { set_sensor = { sensor = "cold_aisle", value = 23.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 44.0 } },
  { wait_ms = 5000 },     # 30 s: A1 throttled, so it starts to fall
  { set_sensor = { sensor = "rack_a1.inlet", value = 34.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 34.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 28.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 27.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 45.0 } },
  { wait_ms = 5000 },     # 35 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 33.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 35.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 30.0 } },
  { wait_ms = 5000 },     # 40 s: fan repaired
  { set_sensor = { sensor = "rack_a1.inlet", value = 31.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 33.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 29.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 26.0 } },
  { wait_ms = 5000 },     # 45 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 28.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 29.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 27.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 25.0 } },
  { set_sensor = { sensor = "cold_aisle", value = 21.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 41.0 } },
  { wait_ms = 5000 },     # 50 s: A1 back to full power
  { set_sensor = { sensor = "rack_a1.inlet", value = 25.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 26.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 24.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 23.0 } },
  { set_sensor = { sensor = "rack_a1.power", value = 8.2 } },
  { set_sensor = { sensor = "hall_power", value = 72.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 37.0 } },
  { wait_ms = 5000 },     # 55 s
  { set_sensor = { sensor = "rack_a1.inlet", value = 22.0 } },
  { set_sensor = { sensor = "rack_a2.inlet", value = 22.0 } },
  { set_sensor = { sensor = "rack_a3.inlet", value = 22.0 } },
  { set_sensor = { sensor = "rack_b1.inlet", value = 22.0 } },
  { set_sensor = { sensor = "cold_aisle", value = 20.0 } },
  { set_sensor = { sensor = "hot_aisle", value = 34.0 } },
]

[[scenes.cooling_failure.tracks]]
name = "scout investigates"
steps = [
  { wait_ms = 8000 },
  { move_to = { mm = "scout", point = [8.0, 9.25] } },
  { wait_idle = "scout" },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { set_sensor = { sensor = "scout.ambient", value = 38.0 } },
  { wait_ms = 5000 },
  { move_to = { mm = "scout", point = [14.0, 9.25] } },
  { wait_idle = "scout" },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { set_sensor = { sensor = "scout.ambient", value = 35.0 } },
  { wait_ms = 5000 },
  { move_to = { mm = "scout", point = [20.0, 9.25] } },
  { wait_idle = "scout" },
  { perform = { mm = "scout", action = "thermal_scan" } },
  { set_sensor = { sensor = "scout.ambient", value = 31.0 } },
  { wait_ms = 3000 },
  { move_to = { mm = "scout", point = [5.1, 9.25] } },
  { wait_ms = 6000 },
  { perform = { mm = "scout", action = "thermal_scan" } },    # on the move
  { set_sensor = { sensor = "scout.ambient", value = 24.0 } },
  { wait_idle = "scout" },
]

[[scenes.cooling_failure.tracks]]
name = "service bot responds"
steps = [
  { wait_ms = 18000 },
  { move_to = { mm = "service_bot", point = [4.2, 10.0] } },
  { wait_idle = "service_bot" },
  { move_to = { mm = "service_bot", machine = "rack_a1" } },
  { wait_idle = "service_bot" },
  { perform = { mm = "service_bot", action = "throttle_rack" } },
  { set_sensor = { sensor = "rack_a1.power", value = 4.0 } },
  { set_sensor = { sensor = "hall_power", value = 66.0 } },
  { wait_ms = 2000 },
  { move_to = { mm = "service_bot", point = [4.2, 10.0] } },
  { wait_idle = "service_bot" },
  { move_to = { mm = "service_bot", machine = "cooling_unit_a" } },
  { wait_idle = "service_bot" },
  { perform = { mm = "service_bot", action = "repair_unit" } },
  { wait_ms = 5000 },
  { set_sensor = { sensor = "cooling_unit_a.fan", value = 70.0 } },
  { move_to = { mm = "service_bot", machine = "spares" } },
  { wait_idle = "service_bot" },
]

# --- Output -----------------------------------------------------------------------------------

[output]
position_interval_ms = 100

# Every event as one JSON line on stdout (the terminal running the app).
[output.sinks.terminal]
type = "stdout"

# Stream every event over TCP to each client that connects.
# Only one process can listen on a port at a time.
[output.sinks.tcp]
type = "tcp"
bind = "127.0.0.1:9000"
