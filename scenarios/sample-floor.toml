# Default shopfloor: three machines, two mobile manipulators, sensors and MM actions.
#
# Units: metres, seconds. Origin is the bottom-left corner of the floor, y points up.
# Mounted sensors are nested under their machine/MM; their id is "<host>.<name>".
# Free-standing sensors are top-level [sensors.<id>] tables with a fixed position.
# Unknown keys are errors. See README.md for the full reference.

name = "Shopfloor example"

[sim]
tick_ms = 20             # fixed engine step
seed = 42                # sensor-noise RNG seed (runs are reproducible)
dock_tolerance_m = 0.9   # an MM this close to a dock is "at" that machine

[floor]
width_m = 20.0
height_m = 12.0
grid_m = 1.0

# --- Machines (fixed) -------------------------------------------------------------------------

[machines.machine1]
label = "Encaser"
position = [4.0, 9.5]    # centre of the footprint
size = [3.0, 2.0]
# dock defaults to 0.5 m below the footprint: (4.0, 8.0)

[machines.machine1.sensors.vibration]
unit = "g"
default = 0.3
range = [0.0, 5.0]
period_ms = 500

[machines.machine2]
label = "Deflasher"
position = [4.0, 4.0]
size = [3.0, 2.0]

[machines.machine2.sensors.temperature]
unit = "°C"
default = 45.0
range = [0.0, 120.0]
period_ms = 1000
noise_std = 0.2

[machines.machine3]
label = "Stocker"
position = [16.5, 4.0]
size = [2.5, 3.0]
dock = [14.6, 4.0]       # serviced from its left side

# [machines.machine3.sensors.current]
# label = "Spindle current"
# unit = "A"
# default = 4.0
# range = [0.0, 20.0]
# period_ms = 1000

# --- Mobile manipulators ----------------------------------------------------------------------

[mobile_manipulators.mm1]
label = "MM 1"
start_at = "machine1"
max_speed_mps = 0.8
radius_m = 0.35

[mobile_manipulators.mm1.sensors.vibration]
unit = "g"
default = 0.1
range = [0.0, 2.0]
period_ms = 500

[mobile_manipulators.mm1.sensors.lidar]
label = "Lidar (nearest obstacle)"
unit = "m"
default = 3.0
range = [0.0, 30.0]
period_ms = 500

[mobile_manipulators.mm2]
label = "MM 2"
start = [15.0, 9.0]
start_heading_deg = 90.0
max_speed_mps = 0.6
radius_m = 0.35
actions = ["inspect"]    # only some of [actions] (default: all of them)

[mobile_manipulators.mm2.sensors.vibration_1]
label = "Vibration 1"
kind = "vibration"
unit = "g"
default = 0.1
range = [0.0, 2.0]
period_ms = 500
noise_std = 0.01

[mobile_manipulators.mm2.sensors.vibration_2]
label = "Vibration 2"
kind = "vibration"
unit = "g"
default = 0.12
range = [0.0, 2.0]
period_ms = 500
noise_std = 0.01

[mobile_manipulators.mm2.sensors.vibration_3]
label = "Vibration 3"
kind = "vibration"
unit = "g"
default = 0.14
range = [0.0, 2.0]
period_ms = 500
noise_std = 0.01

# --- Free-standing sensors (fixed position on the floor) -------------------------------------

[sensors.particulate_matter]
label = "Particulate matter"
position = [9.0, 9.5]
kind = "particulate_matter"   # PM2.5 mass concentration
unit = "µg/m³"
default = 12.0
range = [0.0, 500.0]
period_ms = 1000
noise_std = 0.5

[sensors.noise_level]
label = "Noise level"
position = [12.0, 2.0]
kind = "sound"
unit = "dB"
default = 65.0
range = [30.0, 120.0]
period_ms = 1000

# --- Actions (silent: they only emit an `action` event) ----------------------------------------

[actions.pick]
label = "Pick"
requires_machine = true          # only while docked at a machine
# allowed_while_moving = false   # default: the MM must be stopped

[actions.place]
label = "Place"
requires_machine = true

[actions.inspect]
label = "Inspect"                # anywhere, while stopped

# --- Scenes (scripted runs: tracks run in parallel, steps within a track run in order) ---------
#
# Steps: move_to {mm, machine | point}, stop, perform {mm, action}, set_sensor {sensor, value},
# set_sensor_noise {sensor, std}, pause_sensor, resume_sensor, wait_ms, wait_idle (until that MM has
# no move in progress).
# An iteration ends when every track is done; `loop = true` or `repeat = N` runs it again.

[scenes.production]
label = "Production loop"
loop = true

[[scenes.production.tracks]]
name = "mm1 shuttle"
steps = [
  { move_to = { mm = "mm1", machine = "machine2" } },
  { wait_idle = "mm1" },
  { perform = { mm = "mm1", action = "pick" } },
  { wait_ms = 1500 },
  { move_to = { mm = "mm1", machine = "machine3" } },
  { wait_idle = "mm1" },
  { perform = { mm = "mm1", action = "place" } },
  { wait_ms = 1500 },
  { move_to = { mm = "mm1", machine = "machine1" } },
  { wait_idle = "mm1" },
]

[[scenes.production.tracks]]
name = "mm2 patrol"
steps = [
  { move_to = { mm = "mm2", point = [10.0, 8.0] } },
  { wait_idle = "mm2" },
  { perform = { mm = "mm2", action = "inspect" } },
  { wait_ms = 2000 },
  { move_to = { mm = "mm2", point = [10.0, 5.0] } },
  { wait_idle = "mm2" },
  { perform = { mm = "mm2", action = "inspect" } },
]

[[scenes.production.tracks]]
name = "mm1 vibration"
steps = [
  { wait_ms = 15000 },
  { set_sensor = { sensor = "mm1.vibration", value = 1.2 } },
  { wait_ms = 8000 },
  { set_sensor = { sensor = "mm1.vibration", value = 0.1 } },
]

# mm1 picks a part at the Deflasher and carries it to the Stocker; on the way its vibration goes high.
[scenes.vibration_fault]
label = "MM1 vibration fault"

[[scenes.vibration_fault.tracks]]
steps = [
  { move_to = { mm = "mm1", machine = "machine2" } },
  { wait_idle = "mm1" },
  { perform = { mm = "mm1", action = "pick" } },
  { move_to = { mm = "mm1", machine = "machine3" } },
  { wait_ms = 5000 },
  { set_sensor = { sensor = "mm1.vibration", value = 1.5 } },
  { wait_idle = "mm1" },
  { perform = { mm = "mm1", action = "place" } },
  { set_sensor = { sensor = "mm1.vibration", value = 0.1 } },
]

# mm1 carries parts from the Encaser to the Deflasher, over and over. Each iteration starts by going
# back to the Encaser (mm1 starts there, so the first move is immediate).
[scenes.encaser_to_deflasher]
label = "Encaser to Deflasher"
loop = true

[[scenes.encaser_to_deflasher.tracks]]
name = "mm1 shuttle"
steps = [
  { move_to = { mm = "mm1", machine = "machine1" } },
  { wait_idle = "mm1" },
  { perform = { mm = "mm1", action = "pick" } },
  { wait_ms = 1500 },
  { move_to = { mm = "mm1", machine = "machine2" } },
  { wait_idle = "mm1" },
  { perform = { mm = "mm1", action = "place" } },
  { wait_ms = 1500 },
]

# mm1's vibration sensor fails for 10 s while mm1 carries on: its readings simply stop. The two
# `sensor_set` events record what really happened.
[scenes.sensor_dropout]
label = "MM1 vibration sensor dropout"

[[scenes.sensor_dropout.tracks]]
steps = [
  { move_to = { mm = "mm1", machine = "machine2" } },
  { wait_ms = 2000 },
  { pause_sensor = "mm1.vibration" },
  { wait_ms = 10000 },
  { resume_sensor = "mm1.vibration" },
  { wait_ms = 3000 },
]

# --- Output -----------------------------------------------------------------------------------

[output]
position_interval_ms = 100   # moving MMs report their position this often

# Every event as one JSON line on stdout (the terminal running the app).
[output.sinks.terminal]
type = "stdout"

# Stream every event over TCP to each client that connects (see "Streaming over TCP" in the README).
# Only one process can listen on a port at a time.
[output.sinks.tcp]
type = "tcp"
bind = "127.0.0.1:9000"

