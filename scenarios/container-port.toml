[[scenes.container_flow.tracks]]
name = "straddle carrier: block B to block C and back, twice"
steps = [
  { perform = { mm = "straddle", action = "load" } },
  { wait_ms = 5000 },
  { move_to = { mm = "straddle", machine = "block_c" } },
  { wait_idle = "straddle" },
  { perform = { mm = "straddle", action = "unload" } },
  { wait_ms = 5000 },
  { move_to = { mm = "straddle", machine = "block_b" } },
  { wait_idle = "straddle" },
  { perform = { mm = "straddle", action = "load" } },
  { wait_ms = 5000 },
  { move_to = { mm = "straddle", machine = "block_c" } },
