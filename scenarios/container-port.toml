# --- Output -----------------------------------------------------------------------------------

[output]
position_interval_ms = 200   # less often than indoors: at 8 m/s this is still a report every 1.6 m

# Every event as one JSON line on stdout (the terminal running the app).
[output.sinks.terminal]
type = "stdout"

# Stream every event over TCP to each client that connects (e.g. Liminal).
# Only one process can listen on a port at a time.
[output.sinks.tcp]
type = "tcp"
bind = "127.0.0.1:9000"
