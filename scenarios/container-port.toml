# The wind builds and passes 20 m/s at 20 s, so the cranes stop. The AGVs finish what they carry and
# queue under the cranes, and trucks back up at the gate. It drops below 20 m/s at 55 s, the cranes
# restart at 60 s and work resumes. Tracks can't react to each other, so their times are worked out
# from the vehicles' speeds and distances.
[scenes.high_wind]
label = "High wind stops the cranes"

[[scenes.high_wind.tracks]]
name = "wind"
steps = [
  { wait_ms = 5000 },     # 5 s
  { set_sensor = { sensor = "wind", value = 11.0 } },
  { wait_ms = 5000 },     # 10 s: gusty from here on
  { set_sensor = { sensor = "wind", value = 15.0 } },
  { set_sensor_noise = { sensor = "wind", std = 1.2 } },
  { wait_ms = 5000 },     # 15 s
  { set_sensor = { sensor = "wind", value = 18.0 } },
  { wait_ms = 5000 },     # 20 s
  { set_sensor = { sensor = "wind", value = 24.0 } },
  { wait_ms = 15000 },    # 35 s
  { set_sensor = { sensor = "wind", value = 28.0 } },
  { wait_ms = 15000 },    # 50 s
  { set_sensor = { sensor = "wind", value = 23.0 } },
  { wait_ms = 5000 },     # 55 s
  { set_sensor = { sensor = "wind", value = 16.0 } },
  { wait_ms = 5000 },     # 60 s
  { set_sensor = { sensor = "wind", value = 11.0 } },
  { set_sensor_noise = { sensor = "wind", std = 0.4 } },
  { wait_ms = 5000 },     # 65 s
  { set_sensor = { sensor = "wind", value = 6.0 } },
]

[[scenes.high_wind.tracks]]
name = "cranes stop and restart"
steps = [
  { wait_ms = 20000 },    # 20 s
  { set_sensor = { sensor = "crane_q1.hoist", value = 0.0 } },
  { set_sensor = { sensor = "crane_q2.hoist", value = 0.0 } },
  { set_sensor = { sensor = "crane_q3.hoist", value = 0.0 } },
  { wait_ms = 40000 },    # 60 s
  { set_sensor = { sensor = "crane_q1.hoist", value = 1.5 } },
  { set_sensor = { sensor = "crane_q2.hoist", value = 1.5 } },
  { set_sensor = { sensor = "crane_q3.hoist", value = 1.5 } },
]

[[scenes.high_wind.tracks]]
name = "trucks back up at the gate"
steps = [
  { wait_ms = 25000 },    # 25 s
  { set_sensor = { sensor = "gate.queue", value = 9.0 } },
  { wait_ms = 10000 },    # 35 s
  { set_sensor = { sensor = "gate.queue", value = 15.0 } },
  { wait_ms = 10000 },    # 45 s
  { set_sensor = { sensor = "gate.queue", value = 22.0 } },
  { wait_ms = 10000 },    # 55 s
  { set_sensor = { sensor = "gate.queue", value = 28.0 } },
  { wait_ms = 10000 },    # 65 s
  { set_sensor = { sensor = "gate.queue", value = 20.0 } },
  { wait_ms = 10000 },    # 75 s
  { set_sensor = { sensor = "gate.queue", value = 11.0 } },
  { wait_ms = 10000 },    # 85 s
  { set_sensor = { sensor = "gate.queue", value = 4.0 } },
]

[[scenes.high_wind.tracks]]
name = "AGV 1: one delivery, queue at crane Q1, one more"
steps = [
  { set_sensor = { sensor = "crane_q1.load", value = 28.0 } },
  { perform = { mm = "agv1", action = "load" } },
  { wait_ms = 4000 },
  { set_sensor = { sensor = "crane_q1.load", value = 0.0 } },
  { move_to = { mm = "agv1", point = [140.0, 126.0] } },
  { wait_idle = "agv1" },
  { move_to = { mm = "agv1", point = [140.0, 56.0] } },
  { wait_idle = "agv1" },
  { move_to = { mm = "agv1", machine = "block_d" } },
  { wait_idle = "agv1" },
  { perform = { mm = "agv1", action = "unload" } },
  { wait_ms = 4000 },
