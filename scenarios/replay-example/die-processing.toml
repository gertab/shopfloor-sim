# A die-processing shopfloor, with Liminal Desk traces to replay on it (see "Replaying Liminal Desk traces" in the README).
#
# Dies go from the stocker to the bonder, the encaser and the deflasher, and back to the stocker each time,
# carried by two mobile manipulators. The ids match the traces' `device_id`, `target`, `source` and
# `destination`, so their events can be drawn on this floor.
#
#   cargo run --bin shopfloor -- replay scenarios/die-processing/die-processing.toml   # real time, about 66 s
#   cargo run --bin shopfloor -- check scenarios/die-processing/die-processing.toml    # check the traces against it
#
# In the app it simulates like any other scenario; the Replay section on the right starts the replay.
#
# Units: metres, seconds.

name = "Die processing shopfloor"

[sim]
tick_ms = 20
seed = 11
start_paused = true      # opens paused in the app: Resume (or Space) starts the clock
dock_tolerance_m = 0.9   # an MM this close to a dock is "at" that machine

[floor]
width_m = 14.0
height_m = 10.0
grid_m = 1.0

# --- Machines: three down the left, serviced from their right; the stocker on the right ------------

[machines.deflasher]
label = "Deflasher"
position = [2.0, 8.0]
size = [3.0, 2.0]
dock = [4.0, 8.0]

[machines.encaser]
label = "Encaser"
position = [2.0, 5.0]
size = [3.0, 2.0]
dock = [4.0, 5.0]

[machines.bonder]
label = "Bonder"
position = [2.0, 2.0]
size = [3.0, 2.0]
dock = [4.0, 2.0]

[machines.stocker]
label = "Stocker"
position = [11.75, 5.0]
size = [2.5, 4.0]
dock = [10.0, 5.0]       # serviced from its left side

# --- Mobile manipulators, where the traces start them ----------------------------------------------

[mobile_manipulators.mm-1]
label = "MM 1"
start_at = "stocker"
max_speed_mps = 1.0
radius_m = 0.35

[mobile_manipulators.mm-1.sensors.lidar]
label = "Lidar (distance to target)"
unit = "m"
default = 0.25
range = [0.0, 30.0]
period_ms = 100

[mobile_manipulators.mm-1.sensors.vibration]
unit = "m/s^2"
default = 0.05
range = [0.0, 5.0]
period_ms = 100

[mobile_manipulators.mm-2]
label = "MM 2"
start_at = "bonder"
max_speed_mps = 1.0
radius_m = 0.35

[mobile_manipulators.mm-2.sensors.lidar]
label = "Lidar (distance to target)"
unit = "m"
default = 0.25
range = [0.0, 30.0]
period_ms = 100

[mobile_manipulators.mm-2.sensors.vibration]
unit = "m/s^2"
default = 0.05
range = [0.0, 5.0]
period_ms = 100

# --- Actions ---------------------------------------------------------------------------------------

[actions.pick]
label = "Pick"
requires_machine = true

[actions.place]
label = "Place"
requires_machine = true

# --- Replay: what the Replay section (and `shopfloor replay`) starts with --------------------------

[replay]
traces = ["machine_events.json", "sensor_events.json"]   # relative to this file
format = "payload"       # each payload as written; "envelope" adds v, seq, sim_ms and kind in front
positions = false        # true: also report the positions of moving MMs

# --- Output ----------------------------------------------------------------------------------------

[output]
position_interval_ms = 100

# Stream every message over TCP to each client that connects.
[output.sinks.tcp]
type = "tcp"
bind = "127.0.0.1:9000"

# Publish to MQTT topics under die-cell/ (a broker such as Mosquitto on localhost:1883).
[output.sinks.mqtt]
type = "mqtt"
broker = "127.0.0.1:1883"

[[output.sinks.mqtt.topics]]
topic = "die-cell/sensors"
kinds = ["sensor"]

[[output.sinks.mqtt.topics]]
topic = "die-cell/events"
kinds = ["action", "move_command", "dock", "undock"]

[[output.sinks.mqtt.topics]]
topic = "die-cell/mm-1"
entities = ["mm-1"]

[[output.sinks.mqtt.topics]]
topic = "die-cell/mm-2"
entities = ["mm-2"]

[[output.sinks.mqtt.topics]]
topic = "die-cell/all"

# Every message as a JSON line on stdout (the terminal running the app or the CLI).
[output.sinks.terminal]
type = "stdout"
