[workspace]
members = ["sim", "src-tauri", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.98"
rand = "0.9.1"
rand_distr = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.28", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9.3"
tracing = "0.1"
