name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What the Tauri app (gui/src-tauri) needs to compile on Linux.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # First: the Tauri crate needs gui/dist to exist to compile.
      - name: Frontend (type-check and build)
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # `cargo test` regenerates gui/src/bindings from the Rust types.
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- gui/src/bindings
